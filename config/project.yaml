campaign:
  name: "Mongolia_2022_full_campaign_Ground_Truth"
  run_name: "test_001"            # identifies the processing variant; used for interim/ and outputs/ subfolders
  raw_data_path: "data/raw/Mongolia_2022/Daten_Nisleg_2022"
  survey_nav_path: "data/raw/Mongolia_2022/Daten_Nisleg_2022/TestSurveyNav.csv"
  start_date: "2022-04-24"
  center_area: [107.57, 47.81]       # lon, lat
  projection: "EPSG:32648"           # WGS84 / UTM zone 48N

survey_design:                       # parameters from the flight plan (survey geometry)
  line_spacing_m: 250
  tieline_spacing_m: 1500
  line_direction_deg: 90             # E-W

magnetics:
  igrf_base_field_nT: 59150
  igrf_model: "IGRF-13"

gridding:
  cell_size_m: 60
  method: "minimum_curvature"

line_editing:                        # manual, independent of TestSurveyNav's CrossTrack (M1 QC)
  turn_filter_m: 600                 # max lateral distance (m) from the planned line for a
                                      # point to stay 'line_valid'; only meant to catch gross
                                      # outliers (e.g. Wayp armed near the airport), not to
                                      # enforce flight-quality tolerance
